<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("foldrule-theme")
          const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch {}
      })()
    </script>
    <meta name="description" content="__HOME_DESCRIPTION__" />
    <meta name="keywords" content="__SITE_KEYWORDS__" />
    <meta name="author" content="禄若阳" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_ORIGIN__/" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:title" content="__HOME_TITLE__" />
    <meta property="og:description" content="__HOME_DESCRIPTION__" />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="__HOME_TITLE__" />
    <meta name="twitter:description" content="__HOME_DESCRIPTION__" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "__SITE_NAME__",
        "url": "__SITE_ORIGIN__/",
        "description": "__SITE_DESCRIPTION__",
        "inLanguage": "zh-CN",
        "author": { "@type": "Person", "name": "禄若阳" }
      }
    </script>
    <title>__HOME_TITLE__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
